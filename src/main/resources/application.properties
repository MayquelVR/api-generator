spring.application.name=apigenarator

# Configuraci?n de la base de datos
spring.datasource.url=jdbc:postgresql://localhost:5432/RANDOM_DB_NAME
spring.datasource.username=RANDOM_DB_USER
spring.datasource.password=RANDOM_DB_PASSWORD
spring.datasource.driver-class-name=org.postgresql.Driver

# JWT Configuration
jwt.secret=RANDOM_SECRET_KEY
jwt.expiration=3600000

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# HikariCP Connection Pool Configuration (valores optimizados)
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.pool-name=ApiGeneratorHikariPool

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.liquibase.default-schema=public

# Mail Configuration
spring.mail.host=RANDOM_SMTP_HOST
spring.mail.port=587 
spring.mail.username=RANDOM_SMTP_USER
spring.mail.password=RANDOM_SMTP_PASSWORD
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Application URLs
app.ui-base-url=http://localhost:4200
app.activate-account-path=/activate-account
app.reset-password-path=/reset-password
app.cors.enabled=true
app.cors.allowed-origins=http://localhost:4200

# Logging Configuration (Seguridad)
logging.level.root=INFO
logging.level.com.viewdatatools.apigenarator=INFO
# NO exponer queries SQL en producci?n
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
management.endpoint.health.group.liveness.include=ping,db
management.endpoint.health.group.readiness.include=db
